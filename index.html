<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="description" content="storymoat. Storytelling for the AI era.">
<meta property="og:title" content="storymoat">
<meta property="og:description" content="storymoat. Storytelling for the AI era.">
<title>storymoat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1716'/%3E%3C/svg%3E">


<style>
body{margin:0;background:#0A0A0B}
button{font-family:inherit}
button:hover{opacity:0.75}
button[aria-label^="Close"]:hover,button[aria-label^="Open"]:hover{opacity:1}
button:focus-visible,a:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<script type="speculationrules">{"prefetch":[{"urls":["/","/method","/pricing","/customers","/about"],"eagerness":"eager"}]}</script>
<link rel="prefetch" href="/method"><link rel="prefetch" href="/pricing"><link rel="prefetch" href="/customers"><link rel="prefetch" href="/about">
<style>html{overscroll-behavior:none}html{-webkit-text-size-adjust:100%}*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/inter-500.woff2) format('woff2')}@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format('woff2')}@font-face{font-family:Inter;font-style:normal;font-weight:700 800;font-display:swap;src:url(/fonts/inter-700.woff2) format('woff2')}@view-transition{navigation:auto}[style*='linear-gradient(180deg, #404041']{background:transparent !important;view-transition-name:page}::view-transition-old(root),::view-transition-new(root){animation:none}::view-transition-old(page),::view-transition-new(page){animation-duration:.3s;animation-timing-function:ease}html{background:linear-gradient(180deg,#404041 0%,#3A3535 18%,#2E1716 36%,#5A1A10 52%,#5A2D25 66%,#50393A 100%) no-repeat;background-size:100% 100vh;background-size:100% 100dvh;background-color:#50393A}body{margin:0;background:transparent !important}*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}::selection{background:transparent;color:inherit}::-moz-selection{background:transparent;color:inherit}</style>
</head>
<body>
<div id="root" style="display:contents"></div>
<template id="tpl">

<div style="box-sizing: border-box; width: 100%; height: 100vh; height: 100dvh; background: linear-gradient(180deg, #404041 0%, #3A3535 18%, #2E1716 36%, #5A1A10 52%, #5A2D25 66%, #50393A 100%); color: #ffffff; font-family: Inter, system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 8px">

<div ref="{{ setShell }}" style="box-sizing: border-box; height: 100%; max-width: 100%; aspect-ratio: 9 / 18; position: relative; border: 1.5px solid {{ shellBorder }}; transition: border-color 0.3s ease; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 24px 10px 18px">



<sc-if value="{{ showSplash }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Close storymoat" onClick="{{ onEnter }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; border: 0; padding: 0; background: transparent; color: #ffffff; font-family: inherit; cursor: pointer">
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 600; letter-spacing: 0.32em; padding-left: 0.32em">STORYMOAT</span>
<span style="font-size: 14px; color: rgba(255,255,255,0.74)">storytelling for the AI era</span>
</span>
</button>
</sc-if>
<sc-if value="{{ showMain }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 4px">
<div style="display: flex; align-items: center; gap: 2px; opacity: {{ barOpacity }}; transform: {{ barShift }}; filter: {{ barBlur }}; pointer-events: {{ barPE }}; transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease">
<button type="button" aria-label="Reset to the first version" aria-disabled="{{ resetOff }}" onClick="{{ onReset }}" style="opacity: {{ resetOpacity }}; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: rgba(255,255,255,0.92); display: grid; place-items: center; padding: 0; cursor: pointer; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 4.5 4.5 19.5" /> <path d="m4.5 4.5 15 15" /></svg>
</button>
<button type="button" aria-label="Flip card horizontally" aria-pressed="{{ flipped }}" onClick="{{ onFlip }}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: rgba(255,255,255,0.92); display: grid; place-items: center; padding: 0; cursor: pointer; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14v2" /> <path d="M12 20v2" /> <path d="M12 2v2" /> <path d="M12 8v2" /> <path d="M20.288 16.703A1 1 0 0022 16V8a1 1 0 00-1.712-.703l-3.99 3.991a1 1 0 00-.001 1.424z" /> <path d="M3.712 16.703A1 1 0 012 16V8a1 1 0 011.712-.703l3.99 3.991a1 1 0 01.001 1.424z" /></svg>
</button>
<button type="button" aria-label="Rotate card 90 degrees" onClick="{{ onRotate }}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: rgba(255,255,255,0.92); display: grid; place-items: center; padding: 0; cursor: pointer; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 9V7a2 2 0 0 0-2-2h-6" /> <path d="m15 2-3 3 3 3" /> <path d="M20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2" /></svg>
</button>
<button type="button" aria-label="Draw on the screen" aria-pressed="{{ draw }}" onClick="{{ onDraw }}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{ penBg }}; color: {{ penColor }}; display: grid; place-items: center; padding: 0; cursor: pointer; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 13-.654-4.736a4 4 0 00-2.756-3.266l-9.163-2.9a2 2 0 00-2.017.493l-.82.819a2 2 0 00-.492 2.017l2.9 9.163a4 4 0 003.266 2.756L13 18" /> <path d="M18.648 12.352a1.205 1.205 0 011.704 0l1.296 1.296a1.205 1.205 0 010 1.704l-6.296 6.296a1.205 1.205 0 01-1.704 0l-1.296-1.296a1.205 1.205 0 010-1.704z" /> <path d="m3 3 6.586 6.586" /> <circle cx="11" cy="11" r="2" /></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<button type="button" aria-label="Get in touch" aria-expanded="{{ shareOpen }}" onClick="{{ onShare }}" style="opacity: {{ barOpacity }}; transform: {{ barShift }}; filter: {{ barBlur }}; pointer-events: {{ barPE }}; transition: opacity 0.5s ease 0.06s, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.06s, filter 0.5s ease 0.06s; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: rgba(255,255,255,0.92); display: grid; place-items: center; padding: 0; cursor: pointer; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13" /> <path d="m16 6-4-4-4 4" /> <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /></svg>
</button>
<button type="button" aria-label="Menu" aria-expanded="{{ menuOpen }}" onClick="{{ onMenu }}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{ menuBg }}; color: {{ menuColor }}; transition: background 0.5s ease, color 0.5s ease; display: grid; place-items: center; padding: 0; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" style="transform-box: fill-box; transform-origin: center; transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease; transform: {{ barTop }}"/><path d="M4 12h16" style="transform-box: fill-box; transform-origin: center; transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease; transform: {{ barMid }}; opacity: {{ barMidO }}"/><path d="M4 19h16" style="transform-box: fill-box; transform-origin: center; transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease; transform: {{ barBot }}"/></svg>
</button>
</div>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 {{ cardPadX }}; transition: padding 0.3s ease">
<div style="position: relative; padding: 7px; transform: {{ cardTransform }}; transition: transform 0.5s cubic-bezier(0.34, 1.35, 0.5, 1)">
<div aria-hidden="true" style="position: absolute; top: 7px; left: 7px; right: 7px; background: rgba(12,10,10,0.66); pointer-events: none; height: {{ cropT }}"></div>
<div aria-hidden="true" style="position: absolute; bottom: 7px; left: 7px; right: 7px; background: rgba(12,10,10,0.66); pointer-events: none; height: {{ cropB }}"></div>
<div aria-hidden="true" style="position: absolute; left: 7px; background: rgba(12,10,10,0.66); pointer-events: none; top: {{ sideTop }}; bottom: {{ sideBottom }}; width: {{ cropL }}"></div>
<div aria-hidden="true" style="position: absolute; right: 7px; background: rgba(12,10,10,0.66); pointer-events: none; top: {{ sideTop }}; bottom: {{ sideBottom }}; width: {{ cropR }}"></div>
<div style="position: absolute; pointer-events: none; top: {{ frameTop }}; left: {{ frameLeft }}; right: {{ frameRight }}; bottom: {{ frameBottom }}">
<sc-for list="{{ handles }}" as="h" hint-placeholder-count="8">
<button type="button" aria-label="{{ h.label }}" onPointerDown="{{ h.onDown }}" onPointerMove="{{ h.onMove }}" onPointerUp="{{ h.onUp }}" onPointerCancel="{{ h.onUp }}" onKeyDown="{{ h.onKey }}" style="position: absolute; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; pointer-events: auto; touch-action: none; {{ h.btnCss }}"><span aria-hidden="true" style="position: absolute; {{ h.markCss }}"></span></button>
</sc-for>
</div>
<div ref="{{ setCard }}" onPointerDown="{{ onLitDown }}" onPointerMove="{{ onLitMove }}" onPointerUp="{{ onLitUp }}" onPointerCancel="{{ onLitEnd }}" onPointerLeave="{{ onLitEnd }}" style="container-type: inline-size; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #1A1716; padding: 26px 20px 30px; display: flex; flex-direction: column; gap: 18px">
<button type="button" data-lit="5" aria-label="Show the storymoat wordmark" onClick="{{ onSplash }}" style="color: {{ markColor }}; -webkit-text-stroke-width: {{ litW5 }}; transform: translateX({{ litX5 }}px) scale({{ litS5 }}); transform-origin: left center; transition: -webkit-text-stroke-width 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.5, 0.5, 1); align-self: flex-start; border: 0; padding: 0; background: transparent; font-family: inherit; font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 20px; cursor: pointer">storymoat</button>
<sc-if value="{{ showCopy }}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0; font-size: min(29px, 7.9cqw); font-weight: 800; letter-spacing: 0.012em; line-height: 1.25"><span data-lit="0" style="display: block; white-space: nowrap; transition: color 0.2s ease, -webkit-text-stroke-width 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.5, 0.5, 1); color: {{ litC0 }}; -webkit-text-stroke-width: {{ litW0 }}; transform: translateX({{ litX0 }}px) scale({{ litS0 }}); transform-origin: left center">Companies that win,</span><span data-lit="1" style="display: block; white-space: nowrap; transition: color 0.2s ease, -webkit-text-stroke-width 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.5, 0.5, 1); color: {{ litC1 }}; -webkit-text-stroke-width: {{ litW1 }}; transform: translateX({{ litX1 }}px) scale({{ litS1 }}); transform-origin: left center">tell great stories.</span></h1>
<p data-lit="2" style="margin: 0; font-size: min(16px, 5.6cqw); font-weight: 600; line-height: 1.5; white-space: nowrap; transition: color 0.2s ease, -webkit-text-stroke-width 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.5, 0.5, 1); color: {{ litC2 }}; -webkit-text-stroke-width: {{ litW2 }}; transform: translateX({{ litX2 }}px) scale({{ litS2 }}); transform-origin: left center">We help you uncover yours</p>
<p data-lit="3" style="margin: 0; font-size: min(16px, 5.6cqw); font-weight: 600; line-height: 1.5; white-space: nowrap; transition: color 0.2s ease, -webkit-text-stroke-width 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.5, 0.5, 1); color: {{ litC3 }}; -webkit-text-stroke-width: {{ litW3 }}; transform: translateX({{ litX3 }}px) scale({{ litS3 }}); transform-origin: left center">and tell it to the world.</p>
</sc-if>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Main menu" style="display: flex; flex-direction: column">
<a href="/method" onClick="{{ onNavPick }}" style="animation: rowIn 0.4s ease both; animation-delay: 0ms; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 8px; background: transparent; color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">method<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a href="/pricing" onClick="{{ onNavPick }}" style="animation: rowIn 0.4s ease both; animation-delay: 45ms; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 8px; background: transparent; color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">pricing<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a href="/customers" onClick="{{ onNavPick }}" style="animation: rowIn 0.4s ease both; animation-delay: 90ms; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 8px; background: transparent; color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">customers<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a href="https://noproductmoat.substack.com" target="_blank" rel="noopener" onClick="{{ onNavPick }}" style="animation: rowIn 0.4s ease both; animation-delay: 135ms; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 8px; background: transparent; color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">writing<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
<a href="/about" onClick="{{ onNavPick }}" style="animation: rowIn 0.4s ease both; animation-delay: 180ms; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 8px; background: transparent; color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">about<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</nav>
</sc-if>
</div>
</div>

</div>

<div style="position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 48px; margin-bottom: 28px">
<div aria-live="polite" style="position: relative; flex: 1; text-align: center; font-size: 15px; letter-spacing: 0.01em">
<sc-if value="{{ showStatus }}" hint-placeholder-val="{{ false }}"><span style="color: #E2CFCB">{{ statusText }}</span></sc-if>
<sc-if value="{{ showLabel }}" hint-placeholder-val="{{ false }}"><span aria-live="polite" style="position: absolute; left: 0; right: 0; bottom: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #ffffff; margin-bottom: 8px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Email copied</span></sc-if>
<sc-if value="{{ showQuoteLabel }}" hint-placeholder-val="{{ false }}"><span aria-live="polite" style="position: absolute; left: 0; right: 0; bottom: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #ffffff; margin-bottom: 8px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Text copied</span></sc-if>
<sc-if value="{{ showTag }}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: inline-block"><button type="button" aria-label="Copy quote" onClick="{{ onCopyQuote }}" style="min-height: 3.4em; vertical-align: top; text-align: center; white-space: pre-line; display: inline-block; padding: 4px 9px; border-radius: 7px; border: 0; font: inherit; font-size: 14px; cursor: pointer; transition: background 0.2s ease, color 0.2s ease; animation: rowIn 0.4s ease both; color: {{ quoteColor }}; background: {{ quoteBg }}">{{ tagText }}</button></span></sc-if>
<sc-if value="{{ showEmail }}" hint-placeholder-val="{{ true }}"><span style="position: relative; display: inline-block"><button ref="{{ setBtn }}" type="button" aria-label="Copy email address" onClick="{{ onCopyText }}" style="display: inline-block; padding: 4px 9px; border-radius: 7px; border: 0; font: inherit; cursor: pointer; transition: background 0.2s ease, color {{ emailDur }} ease, font-weight {{ emailDur }} ease; font-weight: {{ emailWeight }}; color: {{ emailColor }}; background: {{ emailBg }}">hello@storymoat.io</button></span></sc-if>
</div>
</div>
</sc-if>
<canvas ref="{{ setCanvas }}" aria-label="Drawing layer" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 1; touch-action: none; cursor: crosshair; pointer-events: {{ canvasPE }}"></canvas>
<button type="button" aria-label="Close share options" onClick="{{ onShare }}" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 3; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: default; opacity: {{ shareOp }}; pointer-events: {{ sharePE }}; transition: opacity 0.5s ease"></button>
<div role="dialog" aria-label="Get in touch" style="position: fixed; left: 50%; transform: translateX(-50%) translateY({{ shareY }}); transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear {{ shareVisDelay }}; visibility: {{ shareVis }}; pointer-events: {{ sharePE }}; width: {{ shareW }}; bottom: 0; z-index: 4; box-sizing: border-box; background: #1A1716; border: 0; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 28px 28px 0 0; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between"><div style="font-size: 17px; font-weight: 600">Get in touch</div><button type="button" aria-label="Close" onClick="{{ onShare }}" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); display: grid; place-items: center; padding: 0; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:0.7"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div style="background: rgba(255,255,255,0.07); border-radius: 14px; overflow: hidden"><textarea ref="{{ setMsg }}" rows="4" placeholder="How can we help?" aria-label="Your message" style="display: block; width: 100%; box-sizing: border-box; border: 0; outline: 0; resize: none; background: transparent; color: #ffffff; font-family: inherit; font-size: 16px; line-height: 1.45; padding: 14px 16px; -webkit-user-select: text; user-select: text; touch-action: manipulation"></textarea></div>
<button type="button" onClick="{{ onSend }}" style="height: 50px; border: 0; border-radius: 14px; background: #E9E5E3; color: #1A1716; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Send</button>
<div style="background: rgba(255,255,255,0.07); border-radius: 14px; overflow: hidden">

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { net: '', wifiLvl: 3, flip: false, turns: 0, draw: false, menu: false, share: false, status: '', emailPhase: 'idle', emailInk: false, quotePhase: 'idle', splash: false, lightY: null, held: null, idle: false, clock: this.getClock(), crop: { l: 0, t: 0, r: 0, b: 0 } };
    this.strokes = [];
    this.drawing = false;
    this.lighting = false;
    this.dragInfo = null;
    this.setBtn = (el) => { this.btnEl = el; this.fitTag(); };
    this.setTag = (el) => { this.tagEl = el; this.fitTag(); };
    this.fitTag = () => {
      const b = this.btnEl, t = this.tagEl;
      if (!b || !t) return;
      t.style.fontSize = '10px';
      const target = b.offsetWidth - 18, w = t.offsetWidth;
      if (w > 0 && target > 0) t.style.fontSize = (10 * target / w) + 'px';
    };
    this.setShell = (el) => {
      if (this.sparkOff) { this.sparkOff(); this.sparkOff = null; }
      if (el) this.sparkOff = this.attachSpark(el, () => !this.state.menu && !this.state.draw);
    };
    this.setCard = (el) => {
      this.card = el;
    };
    this.setCanvas = (el) => {
      this.canvas = el;
      if (el) this.redraw();
    };
    this.handleResize = () => this.redraw();
  }

  scheduleNet() {
    this.netTimer = setTimeout(() => {
      if (Math.random() < 0.6) {
        const w = this.state.wifiLvl;
        const up = w <= 2;
        this.setState({ wifiLvl: w + (up ? 1 : -1) });
      } else {
        const n = this.state.net;
        this.setState({ net: n === '' ? (Math.random() < 0.5 ? '5G' : 'LTE') : '' });
      }
      this.scheduleNet();
    }, 20000 + Math.random() * 30000);
  }

  getClock() {
    const d = new Date();
    const h = d.getHours() % 12 || 12;
    return h + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  cardSize() {
    const c = this.card;
    return c ? [c.offsetWidth, c.offsetHeight] : [0, 0];
  }

  effCrop() {
    const [W, H] = this.cardSize();
    const c = this.state.crop;
    if (!W) return { l: 0, t: 0, r: 0, b: 0 };
    const MIN = 90;
    const l = Math.min(Math.max(c.l, 0), Math.max(0, W - MIN));
    const r = Math.min(Math.max(c.r, 0), Math.max(0, W - MIN - l));
    const t = Math.min(Math.max(c.t, 0), Math.max(0, H - MIN));
    const b = Math.min(Math.max(c.b, 0), Math.max(0, H - MIN - t));
    return { l, t, r, b };
  }

  toLocal(dx, dy) {
    const s = this.state;
    const turns = s.turns || 0;
    const th = (-turns * 90 * Math.PI) / 180;
    const cos = Math.round(Math.cos(th));
    const sin = Math.round(Math.sin(th));
    const k = turns % 2 === 0 ? 1 : 0.86;
    const x = dx * cos + dy * sin;
    const y = -dx * sin + dy * cos;
    return [x / ((s.flip ? -1 : 1) * k), y / k];
  }

  dragTo(hx, hy, start, dx, dy) {
    const [W, H] = this.cardSize();
    const MIN = 90;
    const [lx, ly] = this.toLocal(dx, dy);
    const c = { l: start.l, t: start.t, r: start.r, b: start.b };
    if (hx === -1) c.l = Math.min(Math.max(start.l + lx, 0), W - start.r - MIN);
    if (hx === 1) c.r = Math.min(Math.max(start.r - lx, 0), W - start.l - MIN);
    if (hy === -1) c.t = Math.min(Math.max(start.t + ly, 0), H - start.b - MIN);
    if (hy === 1) c.b = Math.min(Math.max(start.b - ly, 0), H - start.t - MIN);
    this.setState({ crop: c });
  }

  makeHandles() {
    const C = 'rgba(255,255,255,0.9)';
    const defs = [
      ['Crop top edge', 0, -1], ['Crop bottom edge', 0, 1], ['Crop left edge', -1, 0], ['Crop right edge', 1, 0],
      ['Crop top left corner', -1, -1], ['Crop top right corner', 1, -1], ['Crop bottom left corner', -1, 1], ['Crop bottom right corner', 1, 1]
    ];
    return defs.map(([label, hx, hy]) => {
      const vy = hy < 0 ? 'top' : 'bottom';
      const vx = hx < 0 ? 'left' : 'right';
      let btnCss;
      let markCss;
      if (hx !== 0 && hy !== 0) {
        btnCss = vx + ': -18px; ' + vy + ': -18px; cursor: ' + (hx * hy > 0 ? 'nwse-resize' : 'nesw-resize');
        markCss = vx + ': 11px; ' + vy + ': 11px; width: 24px; height: 24px; border-' + vy + ': 2px solid ' + C + '; border-' + vx + ': 2px solid ' + C;
      } else if (hx === 0) {
        btnCss = 'left: calc(50% - 22px); ' + vy + ': -22px; cursor: ns-resize';
        markCss = 'left: 6px; ' + vy + ': 15px; width: 32px; height: 0; border-' + vy + ': 2px solid ' + C;
      } else {
        btnCss = 'top: calc(50% - 22px); ' + vx + ': -22px; cursor: ew-resize';
        markCss = 'top: 6px; ' + vx + ': 15px; width: 0; height: 32px; border-' + vx + ': 2px solid ' + C;
      }
      return {
        label, btnCss, markCss,
        onDown: (e) => {
          if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
          this.dragInfo = { sx: e.clientX, sy: e.clientY, start: this.effCrop() };
        },
        onMove: (e) => {
          const d = this.dragInfo;
          if (!d) return;
          this.dragTo(hx, hy, d.start, e.clientX - d.sx, e.clientY - d.sy);
        },
        onUp: () => {
          this.dragInfo = null;
          const c = this.effCrop();
          const SN = 16;
          const n = { l: c.l < SN ? 0 : c.l, t: c.t < SN ? 0 : c.t, r: c.r < SN ? 0 : c.r, b: c.b < SN ? 0 : c.b };
          if (n.l !== c.l || n.t !== c.t || n.r !== c.r || n.b !== c.b) {
            this.buzz(10);
            this.setState({ crop: n });
          }
        },
        onKey: (e) => {
          const step = 10;
          let dx = 0;
          let dy = 0;
          if (e.key === 'ArrowLeft') dx = -step;
          else if (e.key === 'ArrowRight') dx = step;
          else if (e.key === 'ArrowUp') dy = -step;
          else if (e.key === 'ArrowDown') dy = step;
          else return;
          e.preventDefault();
          this.dragTo(hx, hy, this.effCrop(), dx, dy);
        }
      };
    });
  }

  buzz(ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) {}
  }

  bestLine(y) {
    if (!this.card) return -1;
    let best = -1;
    let bestD = Infinity;
    this.card.querySelectorAll('[data-lit]').forEach((el) => {
      const i = parseInt(el.getAttribute('data-lit'), 10);
      const d = Math.abs(el.offsetTop + el.offsetHeight / 2 - this.card.offsetTop - y);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  markLine(s) {
    const cr = this.canvas.getBoundingClientRect();
    const P = s.pts.map((p) => [cr.left + p[0] * cr.width, cr.top + p[1] * cr.height]);
    if (P.length < 4) return;
    const xs = P.map((p) => p[0]);
    const ys = P.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const bw = x1 - x0, bh = y1 - y0;
    const gap = Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]);
    const circle = Math.max(bw, bh) > 40 && bh > 14 && gap < 0.4 * Math.max(bw, bh);
    const under = bw > 60 && bh < 22;
    if (!circle && !under) return;
    let hit = -1;
    let bestD = Infinity;
    this.card.querySelectorAll('[data-lit]').forEach((el) => {
      const r = el.getBoundingClientRect();
      const ov = Math.min(x1, r.right) - Math.max(x0, r.left);
      if (ov < 20) return;
      const cy = (r.top + r.bottom) / 2;
      let d = Infinity;
      if (circle && cy > y0 && cy < y1) d = Math.abs(cy - (y0 + y1) / 2);
      if (under && y0 > r.bottom - 10 && y0 < r.bottom + 24) d = Math.abs(y0 - r.bottom);
      if (d < bestD) {
        bestD = d;
        hit = parseInt(el.getAttribute('data-lit'), 10);
      }
    });
    if (hit < 0) return;
    clearTimeout(this.heldTimer);
    this.buzz(10);
    this.setState({ held: hit });
    this.heldTimer = setTimeout(() => this.setState({ held: null }), 3000);
  }

  wake() {
    clearTimeout(this.idleTimer);
    if (this.state.idle) this.setState({ idle: false });
    this.idleTimer = setTimeout(() => this.setState({ idle: true }), 3000);
  }

  lightAt(e) {
    const r = this.card.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const ly = this.toLocal(e.clientX - cx, e.clientY - cy)[1];
    return this.card.offsetHeight / 2 + ly;
  }

  copyLines() {
    return [
      'Companies that win, tell great stories',
      'We help you uncover yours',
      'and tell it to the world.'
    ];
  }

  inkEmail(e) {
    const b = this.btnEl;
    if (!b || !e) return;
    const r = b.getBoundingClientRect();
    if (!r.width) return;
    const pad = 8;
    if (e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad) {
      clearTimeout(this.inkT);
      if (!this.state.emailInk) { try { navigator.vibrate && navigator.vibrate(8); } catch (er) {} this.setState({ emailInk: true }); }
    }
  }

  armUpright() {
    clearTimeout(this.uprightT);
    this.uprightT = setTimeout(() => {
      if (this.state.flip || this.state.turns) this.setState({ flip: false, turns: 0 });
    }, 20000);
  }

  discoSquares() {
    if (!this.card || document.querySelector('[data-disco]')) return;
    try { navigator.vibrate && navigator.vibrate([10, 40, 10]); } catch (e) {}
    const r = this.card.getBoundingClientRect();
    const cols = ['#FFD27A', '#FF9B54', '#F2635F', '#C9487A', '#FFE9C7'];
    cols.forEach((c, i) => {
      const d = document.createElement('div');
      d.setAttribute('data-disco', '1');
      const off = 5 + i * 7;
      d.style.cssText = 'position:fixed;pointer-events:none;z-index:2;opacity:0;box-sizing:border-box;border:1px solid ' + c + ';box-shadow:0 0 12px ' + c + '55, inset 0 0 8px ' + c + '22;border-radius:2px;left:' + (r.left - off) + 'px;top:' + (r.top - off) + 'px;width:' + (r.width + off * 2) + 'px;height:' + (r.height + off * 2) + 'px';
      document.body.appendChild(d);
      const a = d.animate([
        { opacity: 0, transform: 'scale(1.05)' },
        { opacity: 0.8, transform: 'scale(1)', offset: 0.18 },
        { opacity: 0.2, transform: 'scale(1.012)', offset: 0.4 },
        { opacity: 0.7, transform: 'scale(1)', offset: 0.6 },
        { opacity: 0.15, transform: 'scale(1.01)', offset: 0.8 },
        { opacity: 0, transform: 'scale(1.03)' }
      ], { duration: 2600, delay: i * 170, easing: 'ease-in-out', fill: 'backwards' });
      a.onfinish = () => d.remove();
    });
  }

  drawMoat() {
    if (!this.card) return;
    this.moatFired = true;
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    const host = this.card.parentElement;
    if (!host || host.querySelector('[data-moat]')) return;
    const m = document.createElement('div');
    m.setAttribute('data-moat', '1');
    m.setAttribute('data-keep', '1');
    m.style.cssText = 'position:absolute;left:-30px;top:-30px;right:-30px;bottom:-30px;border:1px solid rgba(255,244,236,0.6);border-radius:2px;pointer-events:none;z-index:2;opacity:0';
    host.appendChild(m);
    const out = '-30px', end = '0px';
    const a = m.animate([
      { opacity: 0, left: out, top: out, right: out, bottom: out },
      { opacity: 1, left: '-24px', top: '-24px', right: '-24px', bottom: '-24px', offset: 0.28 },
      { opacity: 0.9, left: '-20px', top: '-20px', right: '-20px', bottom: '-20px', offset: 0.5 },
      { opacity: 0, left: end, top: end, right: end, bottom: end }
    ], { duration: 3000, easing: 'cubic-bezier(0.45, 0, 0.25, 1)' });
    a.onfinish = () => m.remove();
  }

  flipTag(el) {
    if (!el || el.__busy) return;
    el.__busy = true;
    const A = el.__orig || (el.__orig = el.textContent);
    const B = 'your story is the moat.\nnot your product.';
    const next = el.__alt ? A : B;
    el.__alt = !el.__alt;
    clearTimeout(el.__t);
    if (el.__alt) el.__t = setTimeout(() => this.flipTag(el), 4800);
    el.style.whiteSpace = 'pre-line';
    el.style.textAlign = 'center';
    el.style.verticalAlign = 'top';
    el.style.minHeight = '3.4em';
    el.style.willChange = 'opacity';
    el.style.transition = 'opacity 0.6s ease';
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = next;
      void el.offsetWidth;
      el.style.transition = 'opacity 0.9s ease';
      el.style.opacity = '1';
      setTimeout(() => { el.__busy = false; }, 900);
    }, 620);
  }

  attachSpark(el, allow) {
    if (!el) return () => {};
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return () => {}; } catch (e) {}
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.setAttribute('data-keep', '');
    layer.style.cssText = 'position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit';
    const glow = document.createElement('div');
    glow.style.cssText = 'position:absolute;left:0;top:0;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;background:radial-gradient(circle, rgba(255,244,236,0.085) 0%, rgba(255,244,236,0.03) 40%, rgba(255,244,236,0) 70%);mix-blend-mode:screen;opacity:0;transition:opacity 1.1s ease;will-change:transform,opacity';
    layer.appendChild(glow);
    el.appendChild(layer);
    let down = false, gx = 0, gy = 0, tx = 0, ty = 0, raf = 0, lx = 0, ly = 0, alive = 0;
    const local = (e) => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const loop = () => {
      gx += (tx - gx) * 0.09;
      gy += (ty - gy) * 0.09;
      glow.style.transform = 'translate(' + gx + 'px,' + gy + 'px)';
      raf = (down || Math.abs(tx - gx) + Math.abs(ty - gy) > 0.5) ? requestAnimationFrame(loop) : 0;
    };
    const onDown = (e) => {
      if (!allow()) return;
      if (!layer.isConnected) el.appendChild(layer);
      down = true;
      const p = local(e);
      gx = tx = lx = p[0]; gy = ty = ly = p[1];
      glow.style.transform = 'translate(' + gx + 'px,' + gy + 'px)';
      glow.style.opacity = '1';
      if (!raf) raf = requestAnimationFrame(loop);
    };
    const onMove = (e) => {
      if (!down) return;
      const p = local(e);
      tx = p[0]; ty = p[1];
      if (!raf) raf = requestAnimationFrame(loop);
    };
    const onUp = () => { if (!down) return; down = false; glow.style.opacity = '0'; };
    el.addEventListener('pointerdown', onDown, true);
    el.addEventListener('pointermove', onMove, true);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      el.removeEventListener('pointerdown', onDown, true);
      el.removeEventListener('pointermove', onMove, true);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (raf) cancelAnimationFrame(raf);
      layer.remove();
    };
  }

  componentDidMount() {
    this.moatDown = (e) => {
      const t = e.target;
      if (!(t && t.closest && t.closest('[data-lit="5"]'))) return;
      clearTimeout(this.moatT);
      this.moatT = setTimeout(() => this.drawMoat(), 650);
    };
    this.tapDown = (e) => { this.tapStart = { x: e.clientX, y: e.clientY }; };
    this.tapUp = (e) => {
      const s0 = this.tapStart; this.tapStart = null;
      const st = this.state;
      if (!s0 || !this.card || st.menu || st.draw || st.share) return;
      if (Math.hypot(e.clientX - s0.x, e.clientY - s0.y) > 10) return;
      if (!(e.target && this.card.contains(e.target))) return;
      const now = Date.now();
      this.cardTaps = (now - (this.lastCardTap || 0) < 1000) ? (this.cardTaps || 0) + 1 : 1;
      this.lastCardTap = now;
      if (this.cardTaps >= 5) { this.cardTaps = 0; this.discoSquares(); }
    };
    document.addEventListener('pointerdown', this.tapDown, true);
    document.addEventListener('pointerup', this.tapUp, true);
    this.moatCancel = () => { clearTimeout(this.moatT); if (this.moatFired) setTimeout(() => { this.moatFired = false; }, 500); };
    document.addEventListener('pointerdown', this.moatDown, true);
    document.addEventListener('pointerup', this.moatCancel, true);
    document.addEventListener('pointercancel', this.moatCancel, true);
    document.addEventListener('pointermove', (e) => { if (this.moatT && e.buttons === 0) this.moatCancel(); }, true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.fitTag());
    setTimeout(() => this.fitTag(), 300);
    window.addEventListener('resize', this.handleResize);
    this.onWake = (e) => {
      const t = e && e.target;
      if (t && t.closest && t.closest('[aria-label="Menu"]')) return;
      this.wake();
    };
    ['pointerdown', 'pointermove', 'keydown'].forEach((n) => window.addEventListener(n, this.onWake));
    this.wake();
    this.tick = setInterval(() => this.setState({ clock: this.getClock() }), 15000);
    this.scheduleNet();
    try {
      const v = Number(sessionStorage.getItem('storymoat-menu'));
      sessionStorage.removeItem('storymoat-menu');
      if (v && Date.now() - v < 15000) this.setState({ menu: true, splash: false, draw: false });
    } catch (e) {}
    try {
      const v2 = Number(localStorage.getItem('storymoat-menu'));
      localStorage.removeItem('storymoat-menu');
      if (v2 && Date.now() - v2 < 15000) this.setState({ menu: true, splash: false, draw: false });
    } catch (e) {}
    try {
      const m = String(window.name || '').match(/^storymoat-menu:(\d+)$/);
      if (m) {
        window.name = '';
        if (Date.now() - Number(m[1]) < 15000) this.setState({ menu: true, splash: false, draw: false });
      }
    } catch (e) {}
    try { if (history.state && history.state.menu) { this.setState({ menu: true, splash: false, draw: false }); history.replaceState(null, ''); } } catch (e) {}
    this.pageShow = (e) => { try { if (e.persisted === false && history.state && history.state.menu) { this.setState({ menu: true }); history.replaceState(null, ''); } } catch (er) {} };
    window.addEventListener('pageshow', this.pageShow);
    this.redraw();
  }

  componentWillUnmount() {
    if (this.sparkOff) { this.sparkOff(); this.sparkOff = null; }
    clearTimeout(this.timer);
    clearInterval(this.tick);
    clearTimeout(this.netTimer);
    clearTimeout(this.netTimer2);
    if (this.raf) cancelAnimationFrame(this.raf);
    clearTimeout(this.emailTimer);
    clearTimeout(this.emailTimer2);
    window.removeEventListener('resize', this.handleResize);
    ['pointerdown', 'pointermove', 'keydown'].forEach((n) => window.removeEventListener(n, this.onWake));
    clearTimeout(this.idleTimer);
    clearTimeout(this.heldTimer);
  }

  redraw() {
    const c = this.canvas;
    if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth;
    const h = c.clientHeight;
    const pw = Math.round(w * dpr);
    const ph = Math.round(h * dpr);
    if (c.width !== pw || c.height !== ph) {
      c.width = pw;
      c.height = ph;
    }
    const LIFE = 1500;
    const now = performance.now();
    this.strokes = this.strokes.filter((s) => s.end === null || now - s.pts[s.pts.length - 1][2] < LIFE);
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#ffffff';
    const fade = (t) => Math.pow(Math.max(0, 1 - (now - t) / LIFE), 1.7);
    ctx.fillStyle = '#ffffff';
    const MAXW = 6;
    const cr = (a, b, c, d, u) => 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
    for (const s of this.strokes) {
      const src = s.pts;
      if (src.length < 2) continue;
      let i0 = 0;
      while (i0 < src.length - 1 && fade(src[i0 + 1][2]) <= 0.002) i0++;
      const P = [];
      for (let k = i0; k < src.length; k++) P.push([src[k][0] * w, src[k][1] * h, src[k][2]]);
      const D = [];
      for (let k = 0; k < P.length - 1; k++) {
        const p0 = P[Math.max(0, k - 1)], p1 = P[k], p2 = P[k + 1], p3 = P[Math.min(P.length - 1, k + 2)];
        const steps = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 3));
        for (let q = 0; q < steps; q++) {
          const u = q / steps;
          D.push([cr(p0[0], p1[0], p2[0], p3[0], u), cr(p0[1], p1[1], p2[1], p3[1], u), p1[2] + (p2[2] - p1[2]) * u]);
        }
      }
      D.push(P[P.length - 1]);
      if (D.length < 2) continue;
      const L = [], R = [], A = [];
      for (let k = 0; k < D.length; k++) {
        const a = fade(D[k][2]);
        const pa = D[Math.max(0, k - 1)], pb = D[Math.min(D.length - 1, k + 1)];
        let dx = pb[0] - pa[0], dy = pb[1] - pa[1];
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const hw = (MAXW * Math.pow(a, 0.6)) / 2;
        L.push([D[k][0] - dy * hw, D[k][1] + dx * hw]);
        R.push([D[k][0] + dy * hw, D[k][1] - dx * hw]);
        A.push(a);
      }
      const NB = 28;
      const paths = new Array(NB).fill(null);
      for (let k = 0; k < D.length - 1; k++) {
        const a = (A[k] + A[k + 1]) / 2;
        if (a <= 0.004) continue;
        const bi = Math.min(NB - 1, Math.floor(a * NB));
        const p = paths[bi] || (paths[bi] = new Path2D());
        p.moveTo(L[k][0], L[k][1]);
        p.lineTo(L[k + 1][0], L[k + 1][1]);
        p.lineTo(R[k + 1][0], R[k + 1][1]);
        p.lineTo(R[k][0], R[k][1]);
        p.closePath();
      }
      ctx.fillStyle = s.ink || '#ffffff';
      for (let bi = 0; bi < NB; bi++) {
        if (!paths[bi]) continue;
        ctx.globalAlpha = ((bi + 0.5) / NB) * 0.95;
        ctx.fill(paths[bi], 'nonzero');
      }
    }
    ctx.globalAlpha = 1;
  }

  animate() {
    if (this.raf) return;
    const step = () => {
      this.raf = null;
      this.redraw();
      if (this.drawing || this.strokes.length) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }

  point(e) {
    const r = this.canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  }

  flash(msg) {
    clearTimeout(this.timer);
    this.setState({ status: msg });
    this.timer = setTimeout(() => this.setState({ status: '' }), 1800);
  }

  copyEmail() {
    const fail = () => {
      clearTimeout(this.emailTimer);
      clearTimeout(this.emailTimer2);
      this.setState({ emailPhase: 'idle' });
      this.flash('Copy is blocked here');
    };
    try {
      navigator.clipboard.writeText('hello@storymoat.io').then(() => {}, () => { if (!this.legacyCopy('hello@storymoat.io')) fail(); });
    } catch (e) {
      if (!this.legacyCopy('hello@storymoat.io')) fail();
    }
  }

  legacyCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;width:1px;height:1px;border:0;padding:0';
      document.body.appendChild(ta);
      ta.style.userSelect = 'text'; ta.style.webkitUserSelect = 'text';
      ta.select();
      const ok = document.execCommand('copy');
      try { window.getSelection().removeAllRanges(); ta.blur(); } catch (er) {}
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  copy(text, okMsg) {
    try {
      navigator.clipboard.writeText(text).then(
        () => this.flash(okMsg),
        () => (this.legacyCopy(text) ? this.flash(okMsg) : this.flash('Copy is blocked here'))
      );
    } catch (e) {
      this.flash('Copy is blocked here');
    }
  }

  renderVals() {
    const s = this.state;
    const k = s.turns % 2 === 0 ? 1 : 0.86;
    const sx = (s.flip ? -1 : 1) * k;
    const lines = this.copyLines();
    const eff = this.effCrop();
    const GREY = 'rgba(255,255,255,0.58)';
    const cols = ['#fff', '#fff', GREY, GREY, GREY, '#fff'];
    const wid = ['0px', '0px', '0px', '0px', '0px', '0px'];
    const sc = [1, 1, 1, 1, 1, 1];
    const nx = [0, 0, 0, 0, 0, 0];
    if (s.lightY !== null && this.card) {
      const els = this.card.querySelectorAll('[data-lit]');
      let best = -1;
      let bestD = Infinity;
      els.forEach((el) => {
        const i = parseInt(el.getAttribute('data-lit'), 10);
        const ey = el.offsetTop + el.offsetHeight / 2 - this.card.offsetTop;
        const d = Math.abs(ey - s.lightY);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
        const f = Math.max(0, 1 - d / 90);
        if (i < cols.length && i !== 5 && i > 1) {
          cols[i] = 'rgba(255,255,255,' + (0.58 + 0.3 * f * f).toFixed(3) + ')';
          sc[i] = 1 + 0.025 * f;
          nx[i] = 3 * f;
        }
      });
      if (best >= 0 && best < cols.length) {
        cols[best] = '#ffffff';
        wid[best] = '0.9px';
        sc[best] = 1.06;
        nx[best] = 6;
      }
    }
    if (s.held !== null && s.held !== undefined) {
      cols[s.held] = '#ffffff';
      wid[s.held] = '0.9px';
      sc[s.held] = 1.05;
    }
    const hr = new Date().getHours();
    const night = hr >= 20 || hr < 6;
    return {
      tagText: ['people remember how\nyou make them feel.', 'your story is the moat.\nnot your product.', 'less is more.'][((this.quoteIdx || 0) % 3 + 3) % 3],
      onTag: (e) => this.flipTag(e.target),
      markColor: night ? '#FFE3CC' : '#ffffff',
      barOpacity: s.menu || (s.idle && !s.draw && !s.share) ? 0 : 1,
      barPE: s.menu || (s.idle && !s.draw && !s.share) ? 'none' : 'auto',
      barShift: s.menu ? 'translateY(-8px)' : 'translateY(0)',
      barBlur: s.menu ? 'blur(3px)' : 'blur(0)',
      clock: s.clock,
      wifi3: s.wifiLvl >= 3 ? 1 : 0.3,
      wifi2: s.wifiLvl >= 2 ? 1 : 0.3,
      showNet: !!s.net,
      netLabel: s.net,
      litC0: cols[0],
      litC1: cols[1],
      litC2: cols[2],
      litC3: cols[3],
      litC4: cols[4],
      litW0: wid[0],
      litS0: sc[0],
      litX0: nx[0],
      litW1: wid[1],
      litS1: sc[1],
      litX1: nx[1],
      litW2: wid[2],
      litS2: sc[2],
      litX2: nx[2],
      litW3: wid[3],
      litS3: sc[3],
      litX3: nx[3],
      litW4: wid[4],
      litS4: sc[4],
      litX4: nx[4],
      litW5: wid[5],
      litS5: sc[5],
      litX5: nx[5],
      onLitDown: (e) => {
        if (!this.card) return;
        if (this.state.menu && !(e.target && e.target.closest && e.target.closest('[data-lit="5"]'))) return;
        this.lighting = true;
        this.tapStart = { x: e.clientX, y: e.clientY, t: performance.now(), onControl: !!(e.target && e.target.closest && e.target.closest('button, a')) };
        const y0 = this.lightAt(e);
        this.lastLine = this.bestLine(y0);
        this.setState({ lightY: y0 });
      },
      onLitMove: (e) => {
        if (!this.lighting || !this.card) return;
        const y1 = this.lightAt(e);
        const b1 = this.bestLine(y1);
        if (b1 !== this.lastLine) {
          this.lastLine = b1;
          this.buzz(6);
        }
        this.pendingY = y1;
        if (!this.lightRaf) {
          this.lightRaf = requestAnimationFrame(() => {
            this.lightRaf = 0;
            if (this.lighting) this.setState({ lightY: this.pendingY });
          });
        }
      },
      onLitUp: (e) => {
        const st = this.tapStart;
        this.tapStart = null;
        this.lighting = false;
        const isTap = st && !st.onControl && Math.hypot(e.clientX - st.x, e.clientY - st.y) < 8 && performance.now() - st.t < 500;
        this.setState({ lightY: null });
      },
      onLitEnd: () => {
        this.tapStart = null;
        if (!this.lighting) return;
        this.lighting = false;
        this.setState({ lightY: null });
      },
      showSplash: s.splash,
      showMain: !s.splash,
      onEnter: () => this.setState({ splash: false }),
      onSplash: () => {
        if (this.moatFired) return;
        if (this.state.menu) this.setState({ menu: false });
      },
      cropT: eff.t + 'px',
      cropB: eff.b + 'px',
      cropL: eff.l + 'px',
      cropR: eff.r + 'px',
      sideTop: (7 + eff.t) + 'px',
      sideBottom: (7 + eff.b) + 'px',
      frameTop: (7 + eff.t) + 'px',
      frameLeft: (7 + eff.l) + 'px',
      frameRight: (7 + eff.r) + 'px',
      frameBottom: (7 + eff.b) + 'px',
      handles: this.makeHandles(),
      setCard: this.setCard,
      setMsg: (el) => { this.msgEl = el; },
      onSend: () => { const v = this.msgEl ? this.msgEl.value.trim() : ''; window.location.href = 'mailto:hello@storymoat.io?subject=' + encodeURIComponent('Hello storymoat') + (v ? '&body=' + encodeURIComponent(v) : ''); },
      setShell: this.setShell,
      setBtn: this.setBtn,
      setTag: this.setTag,
      shareW: (typeof window !== 'undefined' && window.innerWidth < 700) ? '100vw' : 'min(100vw, calc(100dvh / 2))',
      shareOpen: s.share,
      shareOp: s.share ? 1 : 0,
      sharePE: s.share ? 'auto' : 'none',
      shareY: s.share ? '0%' : '105%',
      shareVis: s.share ? 'visible' : 'hidden',
      shareVisDelay: s.share ? '0s' : '0.6s',
      shellBorder: 'transparent',
      copyLabel: s.status === 'Link copied' ? 'Copied' : (s.status ? 'Blocked here' : 'Copy link'),
      headline: lines[0],
      line1: lines[1],
      line2: lines[2],
      cardTransform: (s.menu || s.share) ? 'rotate(0deg) scale(1, 1)' : 'rotate(' + (-s.turns * 90) + 'deg) scale(' + sx + ', ' + k + ')',
      draw: s.draw,
      penBg: s.draw ? '#E9E5E3' : 'transparent',
      penColor: s.draw ? '#1A1716' : '#ffffff',
      canvasPE: s.draw ? 'auto' : 'none',
      flipped: s.flip,
      menuOpen: s.menu,
      resetOff: !(s.flip || s.turns || s.draw || s.menu || s.share || s.splash || s.crop.l || s.crop.t || s.crop.r || s.crop.b),
      resetOpacity: (s.flip || s.turns || s.draw || s.menu || s.share || s.splash || s.crop.l || s.crop.t || s.crop.r || s.crop.b) ? 1 : 0.28,
      showBurger: !s.menu,
      barTop: s.menu ? 'translateY(7px) rotate(45deg) scaleX(1.12)' : 'none',
      barMid: s.menu ? 'scaleX(0.2)' : 'none',
      barMidO: s.menu ? 0 : 1,
      barBot: s.menu ? 'translateY(-7px) rotate(-45deg) scaleX(1.12)' : 'none',
      showX: !!s.menu,
      backVis: s.menu ? 'hidden' : 'visible',
      cardPadX: '6px',
      menuBg: s.menu ? '#E9E5E3' : 'transparent',
      menuColor: s.menu ? '#1A1716' : 'rgba(255,255,255,0.92)',
      showCopy: !s.menu,
      showStatus: !!s.status,
      showQuoteLabel: !s.status && s.menu && s.quotePhase === 'selected',
      quoteBg: s.quotePhase === 'selected' ? '#FFD60A' : 'transparent',
      quoteColor: s.quotePhase === 'selected' ? '#1A1716' : 'rgba(255,255,255,0.55)',
      showEmail: !s.status && !s.menu && s.emailPhase !== 'copied',
      showTag: !s.status && s.menu,
      showLabel: !s.status && !s.menu && s.emailPhase === 'selected',
      tagOp: (s.status || s.emailPhase === 'selected') ? 0 : 1,
      emailBg: s.emailPhase === 'selected' ? '#FFD60A' : 'transparent',
      emailColor: s.emailPhase === 'selected' ? '#1A1716' : (s.emailInk ? '#FFD60A' : '#E2CFCB'),
      emailWeight: s.emailInk ? 700 : 400,
      emailDur: s.emailInk ? '0.25s' : '1.2s',
      statusText: s.status,
      setCanvas: this.setCanvas,
      onDown: (e) => {
        if (!this.state.draw || !this.canvas) return;
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        this.drawing = true;
        const inks = ['#ffffff', '#ffffff', '#FFD27A', '#FF9B54', '#F2635F', '#E58AB0', '#FFE9C7'];
        this.strokes.push({ pts: [this.point(e).concat(performance.now())], end: null, ink: inks[Math.floor(Math.random() * inks.length)] });
        this.animate();
        this.inkEmail(e);
      },
      onMove: (e) => {
        if (!this.drawing) return;
        const s = this.strokes[this.strokes.length - 1];
        if (!s) return;
        s.pts.push(this.point(e).concat(performance.now()));
        this.redraw();
        this.inkEmail(e);
      },
      onUp: () => {
        clearTimeout(this.inkT);
        if (this.state.emailInk) this.setState({ emailInk: false });
        if (!this.drawing) return;
        this.drawing = false;
        const s = this.strokes[this.strokes.length - 1];
        if (s) s.end = performance.now();
        this.animate();
        if (s && this.canvas && this.card) this.markLine(s);
      },
      onReset: () => {
        this.strokes = [];
        if (this.raf) {
          cancelAnimationFrame(this.raf);
          this.raf = null;
        }
        this.redraw();
        this.setState({ flip: false, turns: 0, draw: false, menu: false, share: false, status: '', emailPhase: 'idle', splash: false, crop: { l: 0, t: 0, r: 0, b: 0 } });
      },
      onFlip: () => { this.setState({ flip: !this.state.flip, draw: false }); this.armUpright(); },
      onRotate: () => { this.setState({ turns: this.state.turns + 1, draw: false }); this.armUpright(); },
      onDraw: () => this.setState({ draw: !this.state.draw }),
      onMenu: () => {
        const closing = this.state.menu;
        if (!closing) this.quoteIdx = (this.quoteIdx === undefined ? 0 : this.quoteIdx + 1);
        clearTimeout(this.quoteTimer);
        this.setState(closing ? { menu: false, draw: false, quotePhase: 'idle' } : { menu: true, draw: false, quotePhase: 'idle', flip: false, turns: 0 });
        if (closing) this.wake();
      },
      onNavPick: (e) => {
        const ext = e && e.currentTarget && e.currentTarget.getAttribute('target') === '_blank';
        this.setState({ draw: false });
        if (ext) setTimeout(() => this.setState({ menu: false }), 250);
        else { try { history.replaceState({ menu: true }, ''); } catch (er) {} }
      },
      onShare: () => this.setState(this.state.share ? { share: false, draw: false } : { share: true, draw: false, flip: false, turns: 0 }),
      onCopyLink: () => this.copy('https://storymoat.io', 'Link copied'),
      onCopyQuote: () => {
        clearTimeout(this.quoteTimer);
        const q = ['people remember how you make them feel.', 'your story is the moat. not your product.', 'less is more.'][((this.quoteIdx || 0) % 3 + 3) % 3];
        const next = this.state.quotePhase === 'selected' ? 'idle' : 'selected';
        if (next === 'selected') {
          try { navigator.clipboard.writeText(q).then(() => {}, () => this.legacyCopy(q)); } catch (e) { this.legacyCopy(q); }
          this.quoteTimer = setTimeout(() => this.setState({ quotePhase: 'idle' }), 2000);
        }
        this.setState({ quotePhase: next });
      },
      onCopyText: () => {
        clearTimeout(this.emailTimer);
        clearTimeout(this.emailTimer2);
        const next = this.state.emailPhase === 'selected' ? 'idle' : 'selected';
        if (next === 'selected') this.copyEmail();
        this.setState({ emailPhase: next });
        if (next === 'selected') this.emailTimer = setTimeout(() => this.setState({ emailPhase: 'idle' }), 2000);
      }
    };
  }
}

dcMount(Component);

(function(){

var p=location.pathname.replace(/\.html$/,'').replace(/\/$/,'')||'/';

if(i<1)return;
var s=null;
document.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.buttons!==1)return;
  if(e.target.closest&&e.target.closest('button,a,canvas'))return;
  s={x:e.clientX,y:e.clientY,t:Date.now()};
},true);
document.addEventListener('pointerup',function(e){
  if(!s)return;var d=s;s=null;
  var dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(Math.abs(dx)<80||Math.abs(dy)>60||Date.now()-d.t>700)return;
  var j=dx<0?i+1:i-1;

},true);

['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
})();
